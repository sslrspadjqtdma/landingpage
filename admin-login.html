<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f9" />
    <!-- 관리자 페이지는 검색 결과에 노출되지 않게 -->
    <meta name="robots" content="noindex, nofollow" />
    <title>관리자 로그인 | 삼성 라이온즈</title>
    <link rel="stylesheet" href="style.css?v=2026111901" />
    <link rel="stylesheet" href="auth.css?v=2026111901" />
    <link rel="stylesheet" href="admin-login.css?v=2026111901" />
    <script src="admin-login.js?v=2026111901" defer></script>
  </head>
  <body class="auth-page admin-page">
    <header class="auth-header">
      <a class="auth-brand" href="index.html">SAMSUNG LIONS</a>
      <a class="auth-home-link" href="index.html">메인으로 돌아가기</a>
    </header>

    <main class="auth-main admin-main">
      <section class="auth-card admin-card" aria-labelledby="admin-title">
        <img class="admin-logo" src="images/header-logo.png" alt="삼성 라이온즈" />
        <h1 id="admin-title">관리자 로그인</h1>
        <p class="admin-description">웹 관리자모드로 로그인하세요.</p>

        <form class="admin-form" id="admin-form" novalidate>
          <div class="admin-field">
            <label for="admin-site-id">사이트 ID <span>(계정ID)</span></label>
            <input
              id="admin-site-id"
              name="site-id"
              type="text"
              autocomplete="organization"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </div>
          <div class="admin-field">
            <label for="admin-id">관리자ID</label>
            <input
              id="admin-id"
              name="admin-id"
              type="text"
              autocomplete="username"
              autocapitalize="off"
              spellcheck="false"
              required
            />
          </div>
          <div class="admin-field admin-field-password">
            <label for="admin-password">비밀번호</label>
            <input
              id="admin-password"
              name="password"
              type="password"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="admin-eye"
              id="admin-eye"
              aria-label="비밀번호 보기"
              aria-pressed="false"
              aria-controls="admin-password"
            >
              <svg class="admin-eye-open" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <svg class="admin-eye-closed" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M3 3l18 18" />
                <path d="M10.6 5.1A10.5 10.5 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2" />
                <path d="M6.6 6.6A17.4 17.4 0 0 0 2 12s3.6 7 10 7a9.9 9.9 0 0 0 5.4-1.6" />
                <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" />
              </svg>
            </button>
          </div>
          <p class="admin-capslock" id="admin-capslock" hidden>Caps Lock이 켜져 있어요.</p>

          <button class="admin-submit" type="submit">로그인</button>
          <p class="admin-status" id="admin-status" role="status" aria-live="polite"></p>
        </form>

        <p class="auth-notice">
          관리자 전용 페이지입니다. 현재는 화면 시안으로, 입력한 정보는 전송되거나 저장되지 않습니다.
        </p>
      </section>
    </main>
  </body>
</html>
