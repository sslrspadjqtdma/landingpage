<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f9" />
    <title>회원가입 | 삼성 라이온즈</title>
    <link rel="stylesheet" href="style.css?v=2026111901" />
    <link rel="stylesheet" href="auth.css?v=2026111901" />
    <script src="auth.js?v=2026111901" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.min.css" />
    <link rel="stylesheet" href="captcha.css?v=2026111901" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js" defer></script>
    <script src="captcha.js?v=2026111901" defer></script>
  </head>
  <body class="auth-page">
    <header class="auth-header">
      <a class="auth-brand" href="index.html">SAMSUNG LIONS</a>
      <a class="auth-home-link" href="index.html">메인으로 돌아가기</a>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="signup-title">
        <p class="auth-kicker">JOIN THE LIONS</p>
        <h1 id="signup-title">회원가입</h1>
        <p class="auth-description">
          계정을 만들고 삼성 라이온즈 소식을 만나보세요.
        </p>

        <form class="auth-form" data-auth-form="signup">
          <div class="auth-field">
            <label for="signup-name">이름</label>
            <input
              id="signup-name"
              name="name"
              type="text"
              placeholder="이름을 입력해 주세요"
              autocomplete="name"
              required
            />
          </div>
          <div class="auth-field">
            <label for="signup-email">이메일</label>
            <input
              id="signup-email"
              name="email"
              type="email"
              placeholder="example@email.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="auth-field">
            <label for="signup-password">비밀번호</label>
            <input
              id="signup-password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해 주세요"
              autocomplete="new-password"
              minlength="8"
              aria-describedby="signup-password-hint"
              required
            />
            <p class="auth-password-hint" id="signup-password-hint">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 2.8 1.8 20.5h20.4L12 2.8Z" fill="currentColor" />
                <path
                  d="M12 8.5v5.3"
                  fill="none"
                  stroke="#fff"
                  stroke-linecap="round"
                  stroke-width="2"
                />
                <circle cx="12" cy="17" r="1.1" fill="#fff" />
              </svg>
              <span>
                비밀번호는 대문자와 소문자, 특수기호를 이용하여 8자 이상
                포함되어야 합니다.
              </span>
            </p>
          </div>
          <div class="auth-field">
            <label for="signup-password-confirm">비밀번호 확인</label>
            <input
              id="signup-password-confirm"
              name="password-confirm"
              type="password"
              placeholder="비밀번호를 다시 입력해 주세요"
              autocomplete="new-password"
              required
            />
          </div>
          <label class="auth-consent">
            <input name="consent" type="checkbox" required />
            <span>이용약관 및 개인정보 수집 관련 동의하였습니다.</span>
          </label>
          <button class="auth-submit" type="submit">회원가입</button>
          <p class="auth-status" role="status" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
          이미 계정이 있으신가요?
          <a href="login.html">로그인</a>
        </p>
        <p class="auth-notice">
          현재는 화면 시안입니다. 입력한 정보는 전송되거나 저장되지 않습니다.
        </p>
      </section>
    </main>
  </body>
</html>
