<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f3f5f9" />
    <title>로그인 | 삼성 라이온즈</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="auth.css?v=2026111802" />
    <script src="auth.js?v=2026111802" defer></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.min.css" />
    <link rel="stylesheet" href="captcha.css?v=2026111802" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js" defer></script>
    <script src="captcha.js?v=2026111802" defer></script>
  </head>
  <body class="auth-page">
    <header class="auth-header">
      <a class="auth-brand" href="index.html">SAMSUNG LIONS</a>
      <a class="auth-home-link" href="index.html">메인으로 돌아가기</a>
    </header>

    <main class="auth-main">
      <section class="auth-card" aria-labelledby="login-title">
        <p class="auth-kicker">LIONS MEMBER</p>
        <h1 id="login-title">로그인</h1>
        <p class="auth-description">
          삼성 라이온즈 팬 페이지에 오신 것을 환영합니다.
        </p>

        <form class="auth-form" data-auth-form="login">
          <div class="auth-field">
            <label for="login-email">이메일</label>
            <input
              id="login-email"
              name="email"
              type="email"
              placeholder="example@email.com"
              autocomplete="email"
              required
            />
          </div>
          <div class="auth-field">
            <label for="login-password">비밀번호</label>
            <input
              id="login-password"
              name="password"
              type="password"
              placeholder="비밀번호를 입력해 주세요"
              autocomplete="current-password"
              required
            />
          </div>
          <button class="auth-submit" type="submit">로그인</button>
          <p class="auth-status" role="status" aria-live="polite"></p>
        </form>

        <p class="auth-switch">
          아직 계정이 없으신가요?
          <a href="signup.html">회원가입</a>
        </p>
        <p class="auth-notice">
          현재는 화면 시안입니다. 입력한 정보는 전송되거나 저장되지 않습니다.
        </p>
      </section>
    </main>
  </body>
</html>
